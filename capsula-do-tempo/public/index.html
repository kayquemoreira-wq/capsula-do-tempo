<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsula do Tempo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <h1>Capsula do Tempo da Turma</h1>
        <p>Escreva hoje. Seja surpreendido no futuro</p>
    </header>

    <main class="conteudo">
        <section class="cartao">
            <h2>Enterrar uma nova cápsula</h2>
            <form id="form-capsula">
                <label for="autor">Seu Nome</label>
                <input type="text" name="" id="autor" maxlength="60" required>

                <label for="titulo">Título</label>
                <input type="text" id="titulo" maxlength="100" required>

                <label for="mensagem">Mensagem para o futuro</label>
                <textarea id="mensagem" rows="5" maxlength="1000" required></textarea>

                <label for="abre_em">Abrir em</label>
                <input type="datetime-local" id="abre_em" required>

                <button type="submit">Trancar Cápsula</button>
                <p id="aviso" class="aviso"></p>
            </form>
        </section>
        <section>
            <h2>Cápsula da turma</h2>
            <div id="lista">
                <article class="capsula trancada">
                    <h3>Para mim em 2030</h3>
                    <small>por Kayque</small>
                    <p class="contagem">Abrir em 1234 dias</p>
                </article>
                <article class="capsula aberta">
                    <h3>Bem vindos!</h3>
                    <small>Por aluno</small>
                    <p>Está capsula já foi aberta. Esta é a mensagem dele.</p>
                </article>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
